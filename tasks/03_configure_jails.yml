---
- name: Template jail.d/<name>.conf for each jail
  ansible.builtin.template:
    src: jail.d.conf.j2
    dest: "{{ fail2ban_jail_d_dir }}/{{ jail_entry.name }}.conf"
    owner: "{{ fail2ban_config_file_owner }}"
    group: "{{ fail2ban_config_file_group }}"
    mode: "{{ fail2ban_config_file_mode }}"
  loop: "{{ fail2ban_jails }}"
  loop_control:
    loop_var: jail_entry
    label: "{{ jail_entry.name }}"
  become: true
  notify: Restart fail2ban

- name: Ensure jail log files exist
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: ""
    force: false
    owner: root
    group: root
    mode: "0640"
  loop: "{{ fail2ban_jails | selectattr('logpath', 'defined') | map(attribute='logpath') | list | flatten }}"
  become: true
